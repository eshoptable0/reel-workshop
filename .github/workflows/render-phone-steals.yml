name: render-phone-steals
# language: yaml, target: ubuntu-latest — portrait 1080x1920 @60fps, full audio pipeline
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: System deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-liberation python3-venv python3-pip chromium-browser
          node --version

      - name: Clone lemo-opuscar
        run: git clone --depth 1 https://github.com/lemomo-ai/lemo-opuscar.git

      - name: Move film + fetch fonts
        run: |
          cd lemo-opuscar
          mkdir -p films/phone-steals/fonts
          cp -r "$GITHUB_WORKSPACE/film-phone-steals/"* films/phone-steals/
          curl -sL -o films/phone-steals/fonts/Archivo-VF.ttf "https://github.com/google/fonts/raw/main/ofl/archivo/Archivo%5Bwdth%2Cwght%5D.ttf"
          ls films/phone-steals/

      - name: Setup core + voice (with fallback)
        run: |
          cd lemo-opuscar
          sh plugin/skills/lemo-opuscar/scripts/setup.sh deps 2>&1 | tail -4 || echo "setup failed, fallback"
          [ -x .venv/bin/python ] || { python3 -m venv .venv && .venv/bin/pip install -q numpy scipy soundfile soxr pillow; }
          sh plugin/skills/lemo-opuscar/scripts/setup.sh deps voice 2>&1 | tail -4 || echo "voice tier failed, continuing"
          ls .venv/bin | head -4; df -h / | tail -1

      - name: Build (portrait 60fps full audio)
        run: |
          cd lemo-opuscar
          sh films/phone-steals/build.sh 2>&1 | tail -45

      - name: Verify output
        run: |
          cd lemo-opuscar
          ls -la films/phone-steals/phone-steals.mp4
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,width,height -of compact films/phone-steals/phone-steals.mp4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-steals-final
          path: lemo-opuscar/films/phone-steals/phone-steals.mp4
          if-no-files-found: error
