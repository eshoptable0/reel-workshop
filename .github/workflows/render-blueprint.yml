name: render-blueprint
# language: yaml, target: ubuntu-latest GitHub runner (4 core, 16GB)
# full lemo-opuscar blueprint demo render -> artifact
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: System deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-liberation python3-venv python3-pip chromium-browser
          node --version; ffmpeg -version | head -1

      - name: Clone lemo-opuscar
        run: git clone --depth 1 https://github.com/lemomo-ai/lemo-opuscar.git

      - name: Setup lemo core deps
        run: |
          cd lemo-opuscar
          sh plugin/skills/lemo-opuscar/scripts/setup.sh deps 2>&1 | tail -5 || {
            echo "--- fallback manual setup ---"
            npm install --no-audit --no-fund 2>&1 | tail -2
            python3 -m venv .venv
            .venv/bin/pip install -q numpy scipy soundfile soxr pillow 2>&1 | tail -2
          }

      - name: Render blueprint demo (video only, skip TTS voice if offline)
        run: |
          cd lemo-opuscar
          D=styles/blueprint/demo
          # video render — deterministic frames, headless chrome
          node core/render/video.mjs $D --fps 24 --workers 2 --out $D/out/video24.mp4 2>&1 | tail -15

      - name: Mux (video-only, silent film version)
        run: |
          cd lemo-opuscar
          D=styles/blueprint/demo
          mkdir -p $D/out
          # silent mux — no mix.wav (TTS/model heavy), straight video passthrough
          ffmpeg -y -i $D/out/video24.mp4 -c:v copy -an blueprint_silent.mp4 2>&1 | tail -3
          ls -la blueprint_silent.mp4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-demo
          path: lemo-opuscar/blueprint_silent.mp4
          if-no-files-found: error
